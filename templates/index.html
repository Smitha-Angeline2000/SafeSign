<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeSign Upload Contract</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex justify-center items-center h-screen">
    <div class="bg-white p-10 rounded-xl shadow-lg w-full max-w-xl text-center">
        <h1 class="text-3xl font-bold text-gray-800 mb-6">SafeSign</h1>
        <p class="text-gray-600 mb-6">Upload your legal document for instant analysis.</p>

        <form action="/upload" method="post" enctype="multipart/form-data"
              class="flex flex-col items-center gap-4">
            <input type="file" name="file" required
                   class="block w-full text-sm text-gray-700 
                          file:mr-4 file:py-2 file:px-4
                          file:rounded-md file:border-0
                          file:bg-blue-600 file:text-white
                          hover:file:bg-blue-700" />

            <button type="submit"
                    class="mt-4 bg-blue-600 text-white px-6 py-2 rounded-md 
                           hover:bg-blue-700 transition">
                Analyze Document
            </button>
        </form>
    </div>
</body>
</html>
