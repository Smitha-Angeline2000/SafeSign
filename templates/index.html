<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>SafeSign — Contract Risk Analyzer</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <style>
    /* small extra styles for drag area */
    .drop-area {
      border: 2px dashed #cbd5e1;
      padding: 30px;
      border-radius: 8px;
      text-align: center;
      background: #fcfcff;
    }
    .drop-area.dragover { border-color: #2563eb; background: #f0f8ff; }
    .small-muted { color: #6b7280; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>SafeSign — Contract Risk Analyzer</h1>
    <p class="small-muted">Upload a PDF or image (drag & drop or browse). The backend extracts text, detects risky clauses, and gives a fraud/harm risk % and plain-English summary.</p>

    <div id="drop" class="drop-area">
      <p id="dropText">Drop PDF here or <button id="browseBtn">browse files</button></p>
      <input id="fileInput" type="file" accept=".pdf,.png,.jpg,.jpeg" style="display:none" />
    </div>

    <div style="margin-top:18px;">
      <button id="analyzeBtn" disabled>Analyze</button>
      <span id="status" class="small-muted" style="margin-left:12px;"></span>
    </div>

    <hr style="margin:18px 0" />

    <div id="results" style="display:none">
      <h2>Result Summary</h2>
      <div id="summaryBox" class="card"></div>

      <h3>Risk Score</h3>
      <div id="riskBox" class="card"></div>

      <h3>Detected local rules & keywords</h3>
      <pre id="localBox" class="card"></pre>

      <h3>Full Extracted Text</h3>
      <pre id="textBox" class="card" style="max-height:300px; overflow:auto;"></pre>
    </div>
  </div>

<script>
const fileInput = document.getElementById("fileInput");
const drop = document.getElementById("drop");
const browseBtn = document.getElementById("browseBtn");
const analyzeBtn = document.getElementById("analyzeBtn");
const status = document.getElementById("status");
let currentFile = null;

browseBtn.addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", (e) => {
  currentFile = e.target.files[0];
  analyzeBtn.disabled = !currentFile;
  status.textContent = currentFile ? currentFile.name : "";
});

;['dragenter','dragover','dragleave','drop'].forEach(evt => {
  drop.addEventListener(evt, (e) => e.preventDefault());
});
drop.addEventListener('dragover', (e) => drop.classList.add('dragover'));
drop.addEventListener('dragleave', (e) => drop.classList.remove('dragover'));
drop.addEventListener('drop', (e) => {
  drop.classList.remove('dragover');
  const f = e.dataTransfer.files[0];
  if (f) {
    currentFile = f;
    analyzeBtn.disabled = false;
    status.textContent = f.name;
  }
});

analyzeBtn.addEventListener("click", async () => {
  if (!currentFile) return;
  status.textContent = "Uploading & analyzing...";
  analyzeBtn.disabled = true;

  const fd = new FormData();
  fd.append("file", currentFile);

  try {
    const res = await fetch("/api/analyze", { method: "POST", body: fd });
    if (!res.ok) {
      const err = await res.json();
      status.textContent = "Error: " + (err.detail || res.statusText);
      analyzeBtn.disabled = false;
      return;
    }
    const data = await res.json();
    document.getElementById("summaryBox").textContent = data.gpt_summary || data.gpt_explanation || "No summary available.";
    document.getElementById("riskBox").textContent = (data.final_risk_score || 0) + " / 100";
    document.getElementById("localBox").textContent = JSON.stringify(data.local_signals, null, 2);
    document.getElementById("textBox").textContent = data.text || "";
    document.getElementById("results").style.display = "block";
    status.textContent = "Done";
  } catch (e) {
    status.textContent = "Network/Server error: " + e.message;
  } finally {
    analyzeBtn.disabled = false;
  }
});
</script>
</body>
</html>
