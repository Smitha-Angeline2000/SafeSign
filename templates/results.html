<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>SafeSign — Analysis Results</title>
    <link rel="stylesheet" href="/static/styles.css" />
    <style>
        .section-title {
            margin-top: 25px;
            font-size: 18px;
            font-weight: bold;
            color: #1e293b;
        }
        .risk-score {
            font-size: 32px;
            font-weight: bold;
            text-align: center;
            padding: 18px;
            background: #fef3c7;
            border-radius: 10px;
            border: 1px solid #fcd34d;
            color: #b45309;
        }
        .json-box {
            background: #f1f5f9;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            white-space: pre-wrap;
            font-family: Consolas, monospace;
        }
        .small-muted { color: #6b7280; font-size: 14px; }
    </style>
</head>

<body>
    <div class="container">
        <h1>SafeSign — Document Analysis Results</h1>
        <p class="small-muted">Full summary, risks, and extracted content.</p>

        <!-- RISK SCORE -->
        <div class="section-title">Overall Risk Score</div>
        <div id="riskScore" class="risk-score">Loading...</div>

        <!-- SUMMARY -->
        <div class="section-title">Plain-English Summary</div>
        <div id="summaryBox" class="card"></div>

        <!-- EXPLANATION -->
        <div class="section-title">Why This Matters</div>
        <div id="explanationBox" class="card"></div>

        <!-- LOCAL RULES -->
        <div class="section-title">Detected Legal Red Flags</div>
        <pre id="localBox" class="json-box"></pre>

        <!-- FULL TEXT -->
        <div class="section-title">Extracted Contract Text</div>
        <pre id="textBox" class="json-box" style="max-height:350px; overflow:auto;"></pre>
    </div>

    <script>
        </script>

    </script>

</body>
</html>
